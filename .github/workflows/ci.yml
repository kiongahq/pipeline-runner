name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: kiongahq/.github/.github/workflows/python.yml@76e4fed230c4f0b89b1bcf884df60e5b2fffca67
    with:
      python-version: "3.11"       # same as the image
      install: pip install -r requirements-dev.txt
  image:
    needs: python
    uses: kiongahq/.github/.github/workflows/image.yml@76e4fed230c4f0b89b1bcf884df60e5b2fffca67
    permissions: {contents: read, packages: write}
    with: {image: pipeline-runner}
