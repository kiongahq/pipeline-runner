name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  python:
    uses: kiongahq/.github/.github/workflows/python.yml@main
    with:
      python-version: "3.11"       # same as the image
      install: pip install -r requirements-dev.txt
  image:
    needs: python
    uses: kiongahq/.github/.github/workflows/image.yml@main
    permissions: {contents: read, packages: write}
    with: {image: pipeline-runner}
