name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    uses: kiongahq/.github/.github/workflows/python.yml@2517a38a78046eaa6f51afc2dc12a33fc4beb4d7
    with:
      python-version: "3.11"       # same as the image
      install: pip install -r requirements-dev.txt
  image:
    needs: python
    uses: kiongahq/.github/.github/workflows/image.yml@2517a38a78046eaa6f51afc2dc12a33fc4beb4d7
    permissions: {contents: read, packages: write}
    with: {image: pipeline-runner}
